  db:
    image: postgres:16-alpine
    restart: always
    
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - skydeck_net

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skyhightech.com
      PGADMIN_DEFAULT_PASSWORD: skydeck_password
    ports:
      - "5050:80"
    networks:
      - skydeck_net

