# ── SkyDeck Production Compose ──────────────────────────────
# Runs on: 185.159.154.217 (Iranian production server)
#
# The backend image is pulled from the GitLab Container Registry
# via the EU bridge proxy configured in Docker's systemd drop-in.
#
# Required: a .env file alongside this compose file containing
# POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, SECRET_KEY, etc.
# ────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${CI_REGISTRY_IMAGE:-registry.gitlab.com/skyhightech_efb/efb-backend}:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      RUN_SEED: ${RUN_SEED:-false}
      BACKEND_PORT: 8000
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - manual_storage:/app/storage/manuals

volumes:
  pg_data:
  manual_storage:
